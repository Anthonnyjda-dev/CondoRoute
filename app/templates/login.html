<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · CondoRoute</title><link rel="stylesheet" href="/static/style.css"></head><body class="loginbody"><main class="login-card"><div class="brand dark"><span class="logo">⌖</span> Condo<span>Route</span></div><div class="eyebrow">ACESSO RESTRITO</div><h1>Bem-vindo de volta</h1><p class="subheading">Entre com suas credenciais para administrar as portarias e os destinos.</p>{% if error %}<div class="alert">{{error}}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>E-mail corporativo<input type="email" required name="email" autocomplete="username" placeholder="voce@empresa.com"></label><label>Senha<input type="password" required name="password" autocomplete="current-password" placeholder="Sua senha"></label><button class="btn full">Entrar no painel →</button></form><p class="footnote">Primeiro acesso: configure ADMIN_EMAIL e ADMIN_PASSWORD no arquivo .env.</p></main></body></html>
